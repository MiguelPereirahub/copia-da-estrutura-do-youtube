<!DOCTYPE html>

<head>
    <style>
        button{

        }
        @font-face{
            font-family:"+" ;

        span{

        .logo{

        }
        .interação{
            margin-left: 6px;

            border-radius: 50%;

            width: 7vh;/*40px*/

        .interação2{
            color: rgb(37, 37, 37);

            right: -0.1vh;/*4.5vh*/

            height: 40px;
            width: 98px;/*98px*/

        .interação3{
            display: inline-block;
            border: 1px solid lightgrey;
            top: -36px;

            right: 1vh;
            position: relative;
            border-radius: 50%;
            height:41px;/*7.5vh*/
            width: 6vh;

            border-bottom-left-radius: 0px;
        }
        .interação4{

            border: none;
            right:0.1vh;/*-53px*/
            position: relative;
            border-radius: 50%;
            height: 40px;
            width: 7vh;/*40px*/
        }
        .interação5{
            background-color: transparent;
            left:8px;
            top: 60px;
            margin-left: 6px;
            border: none;
            position: relative;
            border-radius: 20px;
            height: 60px;
            width: 70px;/*40px*/
        }

        .interação:hover{
            cursor: pointer;
            background-color: rgb(190, 190, 190);
        }
        .interação2:hover{
            cursor: pointer;
            background-color: rgb(190, 190, 190);
        }
        .interação3:hover{
            cursor: pointer;
            background-color: rgb(190, 190, 190);
        }
        .interação4:hover{
            cursor: pointer;
            background-color: rgb(190, 190, 190);
        }
        .interação5:hover{
            cursor: pointer;
            background-color: rgb(184, 183, 183);
        }


        input{
            margin: auto;
            position: relative;
            padding-right: 20px;
            font-size: 25;
            color:#000;
            top: -40px;
            right: -2.5vh;/*-2.5*/
            border: 1px solid lightgrey;

            width:20vw;
            height: 30px;
         }

        }

            padding: 50px;

        section{

            height: 100vh;
        }
        p{

            font-size: 15px;

    <link rel="shortcut icon" href="youtube (1).png" type="image/x-icon">
